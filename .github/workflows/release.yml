# Builds the Windows installer and publishes it as a GitHub Release in the PUBLIC repo
# marketdragonph/bloop-studio-releases (package.json "build.publish" points installed apps there).
# The code stays in this repo; only the installer, latest.yml and the blockmap are published.
#
# Runs by itself on every push to main that changes the app (docs, README and tests alone don't
# release), and on demand: Actions → Release → Run workflow, or a tag named release-<anything>.
# Needs the secret RELEASES_TOKEN: a fine-grained token with Contents: read and write on
# bloop-studio-releases only (see README → Releasing).
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['release-*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      - '.gitignore'

# write: after publishing, the workflow files CHANGELOG.md's Unreleased notes under the new version.
permissions:
  contents: write

# Pushes in quick succession: the newer run cancels the older one, so only the latest code is
# published. A cancelled run leaves at most a draft release, which installed apps never see.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          # Date versions use this clock: UTC+8, like the team's PCs.
          TZ: Asia/Manila

      # Uploaded with the GitHub CLI (on every hosted runner): the release stays a draft until all three
      # files are up, so installed apps never see a half-published version, and the 120 MB upload retries.
      - name: Publish to bloop-studio-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $repo = 'marketdragonph/bloop-studio-releases'
          $version = (Select-String -Path dist/latest.yml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value
          $exe = "dist/Bloop-Studio-Setup-$version.exe"
          $files = @($exe, "$exe.blockmap", 'dist/latest.yml')
          Write-Host "Publishing $version"

          # Release notes: CHANGELOG.md's "## Unreleased" section, in the words people read.
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $notes = if ($changelog -match '(?s)## Unreleased\s*\r?\n(.*?)(?=\r?\n## |\z)') { $Matches[1].Trim() } else { '' }
          if (-not $notes) { $notes = 'Fixes and improvements.' }
          Set-Content -Path dist/release-notes.md -Value $notes -Encoding utf8

          gh release create "v$version" --repo $repo --draft --title $version --notes-file dist/release-notes.md
          if ($LASTEXITCODE) { exit 1 }

          foreach ($attempt in 1..3) {
            gh release upload "v$version" @files --repo $repo --clobber
            if (-not $LASTEXITCODE) { break }
            if ($attempt -eq 3) { Write-Error 'Upload failed 3 times; the draft release is left for inspection.'; exit 1 }
            Write-Host "Upload attempt $attempt failed; retrying in 20 s"
            Start-Sleep 20
          }

          gh release edit "v$version" --repo $repo --draft=false --latest
          if ($LASTEXITCODE) { exit 1 }
          Write-Host "Published https://github.com/$repo/releases/tag/v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
        id: publish

      # The notes just published move under their version, with a fresh empty Unreleased above them.
      # A CHANGELOG.md-only push does not trigger this workflow (paths-ignore '**.md'), so no loop.
      - name: File the changelog under this version
        shell: pwsh
        run: |
          $version = '${{ steps.publish.outputs.version }}'
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($changelog -notmatch '(?s)## Unreleased\s*\r?\n\s*-') { Write-Host 'No unreleased notes to file.'; exit 0 }
          $changelog = $changelog -replace '## Unreleased', "## Unreleased`n`n## $version"
          Set-Content -Path CHANGELOG.md -Value $changelog.TrimEnd() -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "Changelog: $version"
          git pull --rebase origin main
          git push origin HEAD:main
